<!-- @dsCard group="Status" height=64 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>StatusBadge — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{background:var(--surface);} #root{padding:var(--space-4);}</style>
</head>
<body>
<div id="root" class="ig-root"></div>
<script>
var I = window.Integra, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ig-row' },
  h(I.StatusBadge, { status: 'ok' }), h(I.StatusBadge, { status: 'warn' }), h(I.StatusBadge, { status: 'crit' }),
  h(I.StatusBadge, { status: 'neutral' }), h(I.StatusBadge, { status: 'ok' }, 'IB negativo'), h(I.StatusBadge, { status: 'crit' }, 'MDR · KPC')));
</script>
</body>
</html>
