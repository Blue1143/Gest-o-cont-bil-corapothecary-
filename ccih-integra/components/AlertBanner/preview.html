<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AlertBanner — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{background:var(--surface);} #root{padding:var(--space-4);}</style>
</head>
<body>
<div id="root" class="ig-root"></div>
<script>
var I = window.Integra, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ig-stack', style: { gap: 12 } },
  h(I.AlertBanner, { tone: 'crit', title: 'Possível surto: 3 casos de K. pneumoniae KPC na UTI Adulto em 9 dias',
    actions: [h(I.Button, { key: 1, size: 'sm', variant: 'primary' }, 'Abrir investigação'), h(I.Button, { key: 2, size: 'sm' }, 'Ver casos')] },
    'Instituir precaução de contato para os leitos 4, 7 e 9 e coletar swab de vigilância dos contactantes.'),
  h(I.AlertBanner, { tone: 'warn', title: 'Indicador biológico do ciclo 2610-07 em leitura' }, 'Itens implantáveis desta carga ficam retidos até o resultado.'),
  h(I.AlertBanner, { tone: 'ok', title: 'Bowie-Dick de hoje aprovado nas duas autoclaves.' })));
</script>
</body>
</html>
