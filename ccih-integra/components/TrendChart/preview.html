<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TrendChart — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{background:var(--surface);} #root{padding:var(--space-4);}</style>
</head>
<body>
<div id="root" class="ig-root"></div>
<script>
var I = window.Integra, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(I.TrendChart, {
  title: 'Densidade de incidência de IRAS associadas a dispositivo — UTI Adulto',
  subtitle: 'Casos por 1.000 dispositivos-dia · últimos 12 meses', unit: '‰',
  labels: ['out/25','nov/25','dez/25','jan/26','fev/26','mar/26','abr/26','mai/26','jun/26','jul/26','ago/26','set/26'],
  series: [
    { name: 'IPCS', color: 'iras-ipcs', values: [3.1, 2.8, 2.6, 2.2, 2.9, 2.0, 1.7, 2.3, 1.9, 2.1, 1.8, 2.4] },
    { name: 'PAV', color: 'iras-pav', values: [8.4, 9.1, 7.6, 7.9, 6.8, 7.2, 6.1, 6.6, 5.9, 6.3, 5.4, 5.8] },
    { name: 'ITU-AC', color: 'iras-itu', values: [3.6, 3.2, 3.9, 2.8, 2.5, 3.0, 2.2, 2.6, 2.4, 1.9, 2.1, 2.0] }
  ],
  footnote: 'Passe o cursor ou use as setas do teclado para ler cada mês. Fonte: vigilância ativa CCIH.'
}));
</script>
</body>
</html>
