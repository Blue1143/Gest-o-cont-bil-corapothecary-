<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>InfectionTag — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{background:var(--surface);} #root{padding:var(--space-4);}</style>
</head>
<body>
<div id="root" class="ig-root"></div>
<script>
var I = window.Integra, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'ig-stack', style: { gap: 12 } },
  h('div', { className: 'ig-row' }, ['IPCS', 'PAV', 'ITU-AC', 'ISC', 'OUTRA'].map(function (t) { return h(I.InfectionTag, { key: t, type: t }); })),
  h('div', { className: 'ig-row' }, h(I.InfectionTag, { type: 'IPCS', showName: true }), h(I.InfectionTag, { type: 'ISC', showName: true }))));
</script>
</body>
</html>
