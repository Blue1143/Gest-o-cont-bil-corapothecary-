name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccih_owner
          POSTGRES_PASSWORD: ci-owner-only
          POSTGRES_DB: ccih_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ccih_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_OWNER_URL: postgres://ccih_owner:ci-owner-only@localhost:5432/ccih_test
      TEST_DATABASE_URL: postgres://ccih_app:ci-app-only@localhost:5432/ccih_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Papel de aplicação com privilégio mínimo
        run: |
          PGPASSWORD=ci-owner-only psql -h localhost -U ccih_owner -d ccih_test -c "CREATE ROLE ccih_app LOGIN PASSWORD 'ci-app-only'"
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_DATA_SOURCE: api
